
name: Auto Label Trusted Contributors

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

jobs:
  auto-label:
    name: Add Trusted Contributor Labels
    runs-on: ubuntu-latest

    steps:
      - name: Add required labels to trusted PRs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |
            const { owner, repo } = context.repo;

            // Trusted contributors
            const TRUSTED = [
              'buttler-josh',
              'jainiksha'
            ];

            // Labels to create and apply
            const LABELS = [
              {
                name: 'gssoc:approved',
                color: '0075ca',
                description: 'Approved for GSSoC'
              },
              {
                name: 'level:critical',
                color: 'b60205',
                description: 'Critical level contribution'
              },
              {
                name: 'merge ready',
                color: '0e8a16',
                description: 'Ready to be merged'
              },
              {
                name: 'quality:exceptional',
                color: '00b300',
                description: 'Exceptional quality contribution'
              },
              {
                name: 'type:feature',
                color: 'a2eeef',
                description: 'Feature contribution'
              },
              {
                name: 'type:accessibility',
                color: '7057ff',
                description: 'Accessibility improvement'
              }
            ];

            const labelNames = LABELS.map(label => label.name);

            // Ensure all required labels exist
            async function ensureLabels() {
              for (const label of LABELS) {
                try {
                  await github.rest.issues.getLabel({
                    owner,
                    repo,
                    name: label.name
                  });

                  core.info(`Label exists: ${label.name}`);

                } catch (error) {
                  if (error.status !== 404) {
                    throw error;
                  }

                  try {
                    await github.rest.issues.createLabel({
                      owner,
                      repo,
                      name: label.name,
                      color: label.color,
                      description: label.description
                    });

                    core.info(`Created label: ${label.name}`);

                  } catch (createError) {
                    // Handle a label created concurrently
                    if (createError.status === 422) {
                      await github.rest.issues.getLabel({
                        owner,
                        repo,
                        name: label.name
                      });

                      core.info(`Label already created: ${label.name}`);
                    } else {
                      throw createError;
                    }
                  }
                }
              }
            }

            // Apply labels to a pull request
            async function labelPR(prNumber, author) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: labelNames
              });

              core.info(
                `Successfully applied ${labelNames.length} labels to PR #${prNumber} by @${author}`
              );
            }

            // Check whether a contributor is trusted
            function isTrusted(author) {
              return TRUSTED.includes(author.toLowerCase());
            }

            // Create missing labels before processing PRs
            await ensureLabels();

            // Manual trigger: backfill existing open PRs
            if (context.eventName === 'workflow_dispatch') {

              core.info('Manual trigger detected. Scanning open pull requests...');

              const pullRequests = await github.paginate(
                github.rest.pulls.list,
                {
                  owner,
                  repo,
                  state: 'open',
                  per_page: 100
                }
              );

              let processed = 0;

              for (const pr of pullRequests) {
                const author = pr.user.login;

                if (pr.draft) {
                  core.info(`Skipping draft PR #${pr.number}`);
                  continue;
                }

                if (!isTrusted(author)) {
                  core.info(`Skipping untrusted contributor: @${author}`);
                  continue;
                }

                await labelPR(pr.number, author);
                processed++;
              }

              core.info(
                `Backfill completed. ${processed} trusted PR(s) labeled.`
              );

            } else {

              // Automatic trigger: process the current PR
              const pr = context.payload.pull_request;

              if (!pr) {
                core.setFailed('Pull request information is missing.');
                return;
              }

              const prNumber = pr.number;
              const author = pr.user.login;

              if (pr.draft) {
                core.info(`Skipping draft PR #${prNumber}`);
                return;
              }

              if (!isTrusted(author)) {
                core.info(`Skipping untrusted contributor: @${author}`);
                return;
              }

              await labelPR(prNumber, author);
            }

            core.info('Labeling workflow completed successfully.');
            core.info('No automatic merge operation performed.');
