name: Auto Label Trusted Contributors

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  pull-requests: write

jobs:
  auto-label:
    name: Add trusted contributor labels
    runs-on: ubuntu-latest

    # Only run for trusted contributors
    # No target branch restriction
    if: >
      (
        github.event.pull_request.user.login == 'buttler-josh' ||
        github.event.pull_request.user.login == 'jainiksha'
      ) &&
      github.event.pull_request.draft == false

    steps:
      - name: Add required labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const author = pr.user.login;

            const LABELS = [
              {
                name: "gssoc:approved",
                color: "0075ca",
                description: "Approved for GSSoC"
              },
              {
                name: "level:critical",
                color: "b60205",
                description: "Critical level contribution"
              },
              {
                name: "merge ready",
                color: "0e8a16",
                description: "Ready to be merged"
              },
              {
                name: "quality:exceptional",
                color: "00b300",
                description: "Exceptional quality"
              },
              {
                name: "type:feature",
                color: "a2eeef",
                description: "Feature contribution"
              },
              {
                name: "type:accessibility",
                color: "7057ff",
                description: "Accessibility improvement"
              }
            ];

            core.info(
              `Processing PR #${prNumber} by @${author}`
            );

            // ------------------------------------------------------------
            // 1. Create labels if they don't already exist
            // ------------------------------------------------------------

            for (const label of LABELS) {
              try {
                await github.rest.issues.getLabel({
                  owner,
                  repo,
                  name: label.name
                });

                core.info(`Label already exists: ${label.name}`);

              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });

                  core.info(`Created label: ${label.name}`);
                } else {
                  throw error;
                }
              }
            }

            // ------------------------------------------------------------
            // 2. Add all six labels to the PR
            // ------------------------------------------------------------

            const labelNames = LABELS.map(label => label.name);

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: prNumber,
              labels: labelNames
            });

            core.info(
              `Successfully added ${labelNames.length} labels to PR #${prNumber}`
            );

            core.info(
              `No merge operation performed. PR #${prNumber} requires manual review and merge.`
            );