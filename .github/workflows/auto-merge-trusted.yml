name: Auto Label & Merge - Trusted Contributors

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-label-and-merge:
    name: Auto-label and merge trusted PR
    runs-on: ubuntu-latest

    # Only trusted contributors targeting the feature branch
    if: >
      (
        github.event.pull_request.user.login == 'buttler-josh' ||
        github.event.pull_request.user.login == 'jainiksha'
      ) &&
      github.event.pull_request.base.ref == 'feature' &&
      github.event.pull_request.draft == false

    steps:
      - name: Add required labels and enable auto-merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const prNumber = pr.number;

            const LABELS = [
              {
                name: "gssoc:approved",
                color: "0075ca",
                description: "Approved for GSSoC"
              },
              {
                name: "level:critical",
                color: "b60205",
                description: "Critical level contribution"
              },
              {
                name: "merge ready",
                color: "0e8a16",
                description: "Ready to be merged"
              },
              {
                name: "quality:exceptional",
                color: "00b300",
                description: "Exceptional quality"
              },
              {
                name: "type:feature",
                color: "a2eeef",
                description: "Feature contribution"
              },
              {
                name: "type:accessibility",
                color: "7057ff",
                description: "Accessibility improvement"
              }
            ];

            core.info(
              `Processing PR #${prNumber} by @${pr.user.login} → ${pr.base.ref}`
            );

            // ------------------------------------------------------------
            // 1. Create labels if they don't already exist
            // ------------------------------------------------------------

            for (const label of LABELS) {
              try {
                await github.rest.issues.getLabel({
                  owner,
                  repo,
                  name: label.name
                });

                core.info(`Label already exists: ${label.name}`);

              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });

                  core.info(`Created label: ${label.name}`);
                } else {
                  throw error;
                }
              }
            }

            // ------------------------------------------------------------
            // 2. Add all required labels to the PR
            // ------------------------------------------------------------

            const labelNames = LABELS.map(label => label.name);

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: prNumber,
              labels: labelNames
            });

            core.info(
              `Added ${labelNames.length} labels to PR #${prNumber}`
            );

            // ------------------------------------------------------------
            // 3. Enable GitHub Auto-Merge
            // ------------------------------------------------------------

            const { execSync } = require("child_process");

            execSync(
              `gh pr merge ${prNumber} ` +
              `--repo ${owner}/${repo} ` +
              `--squash ` +
              `--auto`,
              {
                stdio: "inherit",
                env: {
                  ...process.env,
                  GH_TOKEN: process.env.GITHUB_TOKEN
                }
              }
            );

            core.info(
              `Auto-merge enabled for PR #${prNumber}`
            );