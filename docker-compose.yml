version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: preppilot-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: preppilot-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MONGO_URI=mongodb://mongodb:27017/interview_prep_ai
      - JWT_SECRET=development_secret_key_change_in_production
      - FRONTEND_ORIGIN=http://localhost:5173
      - EXTRA_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      # NOTE: Add your GEMINI_API_KEY below or in an .env file
      # - GEMINI_API_KEY=your_gemini_api_key_here
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: preppilot-frontend
    ports:
      - "5173:5173"
    environment:
      # Use localhost so the browser routes requests through nginx on port 80
      - VITE_BACKEND_URL=http://localhost
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: preppilot-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  mongodb_data:
